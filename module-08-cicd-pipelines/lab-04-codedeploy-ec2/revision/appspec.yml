version: 0.0
os: linux
files:
  - source: /
    destination: /opt/dva-lab-08-04
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 30
      runas: root
  BeforeInstall:
    - location: scripts/before-install.sh
      timeout: 30
      runas: root
  AfterInstall:
    - location: scripts/after-install.sh
      timeout: 30
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 30
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 30
      runas: root
